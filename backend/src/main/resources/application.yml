spring:
  application:
    name: sibms
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev} 
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/sibms?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate       
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: tushar-sibms-local-secret-key-2026-abcdef123456
    access-expiration-ms: 900000          # 15 minutes
    refresh-expiration-ms: 604800000      # 7 days
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
  seed:
    admin-name: Admin
    admin-email: ${ADMIN_EMAIL:admin@sibms.com}
    admin-password: ${ADMIN_PASSWORD:Admin@123}
    demo-users: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
