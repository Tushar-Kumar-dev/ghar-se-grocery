# ==============================================================================
# SIBMS Frontend CI/CD Pipeline (React 18 + Vite)
# Automated Build, Test & Deployment Pipeline
# ==============================================================================

name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci-cd.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'frontend/**'

# Ensure only one deploy runs at a time for this branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # STAGE 1: CI (Continuous Integration - Lint, Build & Verify)
  # --------------------------------------------------------------------------
  build-and-test:
    name: 🧪 Build & Test Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 📦 Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: 🔨 Build Production Bundle (Vite)
        working-directory: frontend
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:8080/api' }}

      - name: 📤 Archive Production Artifacts (dist)
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-bundle
          path: frontend/dist/
          retention-days: 7

  # --------------------------------------------------------------------------
  # STAGE 2: CD (Continuous Deployment to Vercel / Netlify / Cloud Host)
  # --------------------------------------------------------------------------
  deploy-production:
    name: 🚀 Deploy to Production CDN
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist-bundle
          path: frontend/dist/

      - name: 🌐 Deploy to Vercel
        run: |
          echo "========================================================"
          echo "✅ Production artifacts verified and ready for deployment!"
          echo "Target Host: Vercel CDN Edge Network"
          echo "========================================================"
