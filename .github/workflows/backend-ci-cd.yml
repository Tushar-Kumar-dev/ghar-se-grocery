# ==============================================================================
# SIBMS Backend CI/CD Pipeline (Spring Boot 3 + Java 17 + MySQL)
# Monorepo Automated Testing, Build, Docker Image & Cloud Deployment
# ==============================================================================

name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci-cd.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'backend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # STAGE 1: CI (Continuous Integration - Maven Test, Verify & Package)
  # --------------------------------------------------------------------------
  build-and-test:
    name: 🧪 Java 17 Test & Compile
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: ☕ Set up JDK 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 📦 Compile & Test Spring Boot Backend
        working-directory: backend
        run: |
          mvn clean test-compile
          mvn test -Dspring.profiles.active=test

      - name: 🔨 Package Executable JAR
        working-directory: backend
        run: mvn package -DskipTests=true

      - name: 📤 Archive Spring Boot JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sibms-backend-jar
          path: backend/target/*.jar
          retention-days: 7

  # --------------------------------------------------------------------------
  # STAGE 2: DOCKER CONTAINERIZATION (Build & Push to GitHub Container Registry)
  # --------------------------------------------------------------------------
  docker-build:
    name: 🐳 Docker Container Build & Push
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and Push Multi-Stage Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ghar-se-grocery-backend:latest
            ghcr.io/${{ github.repository_owner }}/ghar-se-grocery-backend:${{ github.sha }}

  # --------------------------------------------------------------------------
  # STAGE 3: CD (Continuous Deployment to Cloud Platform e.g. Render / Cloud VPS)
  # --------------------------------------------------------------------------
  deploy-cloud:
    name: 🚀 Deploy to Cloud Web Service
    needs: docker-build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: 🌐 Trigger Cloud Deployment (Render / Webhook)
        run: |
          echo "=========================================================="
          echo "Triggering automated Continuous Deployment for Spring Boot"
          echo "=========================================================="
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            echo "Invoking Render Deploy Webhook..."
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
            echo "Deployment webhook dispatched successfully!"
          else
            echo "ℹ️ Note: Set RENDER_DEPLOY_HOOK_URL in GitHub Secrets for 1-click cloud auto-deploy."
          fi
